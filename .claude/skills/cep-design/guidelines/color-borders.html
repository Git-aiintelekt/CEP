<!-- @dsCard group="Colors" viewport="700x150" name="Borders & focus" subtitle="Gray 100 subtle, Gray 150 default, Gray 400 emphasis, Blue 600 focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:center}.b{height:52px;border-radius:var(--radius-sm);background:var(--white)}.k{font:var(--text-label);color:var(--text-tertiary);display:block;margin-top:6px}</style></head><body>
<div class="g">
<div><div class="b" style="border:1px solid var(--border-subtle)"></div><span class="k">Border/Subtle · Gray 100</span></div>
<div><div class="b" style="border:1px solid var(--border-default)"></div><span class="k">Border/Default · Gray 150</span></div>
<div><div class="b" style="border:1px solid var(--border-emphasis)"></div><span class="k">Border/Emphasis · Gray 400</span></div>
<div><div class="b" style="border:1px solid var(--border-focus);box-shadow:var(--focus-ring)"></div><span class="k">Focus · Blue 600 + 3px ring</span></div>
</div></body></html>
