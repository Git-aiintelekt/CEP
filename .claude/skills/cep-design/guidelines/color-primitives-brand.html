<!-- @dsCard group="Colors" viewport="700x150" name="Brand primitives" subtitle="Navy for the sidebar and wordmark, Blue for actions, Teal for the mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.g{display:flex;flex-wrap:wrap;gap:10px}.i{display:flex;align-items:center;gap:8px;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:6px 10px 6px 6px}.sw{width:26px;height:26px;border-radius:4px;border:1px solid rgba(23,24,28,.1);flex:none}.l{display:flex;flex-direction:column}.n{font:var(--fw-semibold) 12px/1.3 var(--font-body)}.h{font:11px/1.3 var(--font-body);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body>
<div class="g"><div class="i"><span class="sw" style="background:var(--color-sidebar)"></span><span class="l"><span class="n">Navy 900</span><span class="h" data-v="color-sidebar"></span></span></div><div class="i"><span class="sw" style="background:var(--color-wordmark-navy)"></span><span class="l"><span class="n">Navy 700</span><span class="h" data-v="color-wordmark-navy"></span></span></div><div class="i"><span class="sw" style="background:var(--brand-600)"></span><span class="l"><span class="n">Blue 600</span><span class="h" data-v="brand-600"></span></span></div><div class="i"><span class="sw" style="background:var(--brand-700)"></span><span class="l"><span class="n">Blue 700</span><span class="h" data-v="brand-700"></span></span></div><div class="i"><span class="sw" style="background:var(--brand-800)"></span><span class="l"><span class="n">Blue 800</span><span class="h" data-v="brand-800"></span></span></div><div class="i"><span class="sw" style="background:var(--brand-100)"></span><span class="l"><span class="n">Blue 100</span><span class="h" data-v="brand-100"></span></span></div><div class="i"><span class="sw" style="background:var(--color-wordmark-teal)"></span><span class="l"><span class="n">Teal 600</span><span class="h" data-v="color-wordmark-teal"></span></span></div></div>
<script>document.querySelectorAll('.h').forEach(e=>{if(!e.textContent)e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.dataset.v).trim().toUpperCase()})</script></body></html>
