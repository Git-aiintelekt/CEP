ound:var(--orange-600)"></span><span class="l"><span class="n">Orange 600</span><span class="h" data-v="orange-600"></span></span></div><div class="i"><span class="sw" style="background:var(--periwinkle-100)"></span><span class="l"><span class="n">Periwinkle 100</span><span class="h" data-v="periwinkle-100"></span></span></div><div class="i"><span class="sw" style="background:var(--periwinkle-500)"></span><span class="l"><span class="n">Periwinkle 500</span><span class="h" data-v="periwinkle-500"></span></span></div><div class="i"><span class="sw" style="background:var(--periwinkle-700)"></span><span class="l"><span class="n">Periwinkle 700</span><span class="h" data-v="periwinkle-700"></span></span></div><div class="i"><span class="sw" style="background:var(--periwinkle-800)"></span><span class="l"><span class="n">Periwinkle 800</span><span class="h" data-v="periwinkle-800"></span></span></div><div class="i"><span class="sw" style="background:var(--yellow-50)"></span><span class="l"><span class="n">Yellow 50</span><span class="h" data-v="yellow-50"></span></span></div></div>
