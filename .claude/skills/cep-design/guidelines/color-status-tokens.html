<!-- @dsCard group="Colors" viewport="700x210" name="Status tokens" subtitle="Accent / background / text triplets — success, warning, error, high, danger" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.i{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.tag{border-radius:var(--radius-sm);padding:3px 8px;font:var(--fw-semibold) 12px/1.5 var(--font-body);display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;flex:none}.k{font:var(--text-label);color:var(--text-tertiary)}.u{font:var(--text-label);color:var(--text-secondary)}</style></head><body>
<div class="g">
<div class="i"><span class="tag" style="background:var(--bg-surface-subtle);color:var(--status-success-text)"><span class="dot" style="background:var(--status-success-accent)"></span>Passed</span><span class="u">Success</span><span class="k">Green 500 accent · Green 800 text</span></div>
<div class="i"><span class="tag" style="background:var(--status-warning-bg);color:var(--status-warning-text)"><span class="dot" style="background:var(--status-warning-accent)"></span>On hold</span><span class="u">Warning</span><span class="k">Amber 100 / 500 / 800</span></div>
<div class="i"><span class="tag" style="background:var(--status-error-bg);color:var(--status-error-text)"><span class="dot" style="background:var(--status-error-accent)"></span>Failed</span><span class="u">Error</span><span class="k">Red 100 / 500 / 800 · plain Red 600</span></div>
<div class="i"><span class="tag" style="background:var(--status-high-bg);color:var(--status-danger-dark-accent)"><span class="dot" style="background:var(--status-high-accent)"></span>High</span><span class="u">High severity</span><span class="k">Orange 100 / 600 · Maroon 700</span></div>
<div class="i"><span class="tag" style="background:var(--brand-tag-bg);color:var(--brand-tag-text)">Email</span><span class="u">Brand tag</span><span class="k">Blue 100 bg · Blue 800 text</span></div>
</div></body></html>
