<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-default)}.k{font:var(--text-label);color:var(--text-tertiary);display:block;margin-top:6px}</style></head><body>
<div class="g">
<div><div class="s" style="background:var(--bg-page)"></div><span class="k">Background/Page · White</span></div>
<div><div class="s" style="background:var(--bg-surface)"></div><span class="k">Background/Surface · White</span></div>
<div><div class="s" style="background:var(--bg-surface-subtle)"></div><span class="k">Surface Subtle · Gray 75</span></div>
<div><div class="s" style="background:var(--bg-sidebar)"></div><span class="k">Background/Sidebar · Navy 900</span></div>
<div><div class="s" style="background:var(--row-flagged-bg)"></div><span class="k">Row/Flagged · Yellow 50</span></div>
</div></body></html>
