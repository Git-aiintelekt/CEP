<!-- @dsCard group="Colors" viewport="700x150" name="Text & wordmark" subtitle="Gray 900 primary, Gray 700 secondary, white on dark; Teal / Navy wordmark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}.i{display:flex;flex-direction:column;gap:4px}.t{font:var(--fw-medium) 16px/1.3 var(--font-body)}.k{font:var(--text-label);color:var(--text-tertiary)}.d{background:var(--bg-sidebar);border-radius:var(--radius-sm);padding:6px 10px;align-self:flex-start}</style></head><body>
<div class="g">
<div class="i"><span class="t" style="color:var(--text-primary)">Primary text</span><span class="k">Text/Primary · Gray 900</span></div>
<div class="i"><span class="t" style="color:var(--text-secondary)">Secondary text</span><span class="k">Text/Secondary · Gray 700</span></div>
<div class="i"><span class="t d" style="color:var(--text-on-dark)">On dark</span><span class="k">Text/On Dark · White</span></div>
<div class="i"><span class="t" style="color:var(--wordmark-teal)">CEP wordmark</span><span class="k">Wordmark/Teal · Teal 600</span></div>
<div class="i"><span class="t" style="color:var(--wordmark-navy)">CEP wordmark</span><span class="k">Wordmark/Navy · Navy 700</span></div>
<div class="i"><span class="t" style="color:var(--brand-primary)">Link / action</span><span class="k">Brand/Primary · Blue 600</span></div>
</div></body></html>
