<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Flat by default — three shadows exist, cards get none of them" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.r{display:flex;gap:18px;padding:14px;background:var(--surface-page)}.i{flex:1;display:flex;flex-direction:column;gap:8px}.b{height:64px;background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-md)}.k{font:var(--text-label);color:var(--text-tertiary)}.v{font:11px/1.4 var(--font-body);color:var(--text-tertiary)}</style></head><body>
<div class="r">
<div class="i"><span class="b"></span><span class="k">cards, tiles, rows</span><span class="v">no shadow — ever</span></div>
<div class="i"><span class="b" style="box-shadow:var(--elev-menu)"></span><span class="k">elev-menu</span><span class="v">0 4px 16px rgba(20,23,31,.10)</span></div>
<div class="i"><span class="b" style="box-shadow:var(--elev-modal)"></span><span class="k">elev-modal</span><span class="v">-12px 0 32px rgba(20,23,31,.14)</span></div>
<div class="i"><span class="b" style="box-shadow:var(--elev-toast)"></span><span class="k">elev-toast</span><span class="v">0 8px 24px rgba(20,23,31,.16)</span></div>
</div></body></html>
