<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="70–240ms, one standard easing, no bounce" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.k{font:var(--text-label);color:var(--text-tertiary)}.v{font:11px/1.5 var(--font-body);color:var(--text-secondary)}.bar{height:6px;border-radius:var(--radius-pill);background:var(--primary-600);margin-bottom:8px}</style></head><body>
<div class="g">
<div><div class="bar" style="width:24%"></div><span class="k">fast · 70ms</span><div class="v">hover, press</div></div>
<div><div class="bar" style="width:40%"></div><span class="k">base · 110ms</span><div class="v">control state change</div></div>
<div><div class="bar" style="width:72%"></div><span class="k">moderate · 240ms</span><div class="v">drawer, modal, progress</div></div>
<div><div class="bar" style="width:100%"></div><span class="k">slow · 400ms</span><div class="v">reserved; rarely used</div></div>
</div>
<div class="v" style="margin-top:10px">--ease-standard cubic-bezier(0.2, 0, 0.38, 0.9) · entrance cubic-bezier(0, 0, 0.38, 0.9) · exit cubic-bezier(0.2, 0, 1, 0.9)</div></body></html>
