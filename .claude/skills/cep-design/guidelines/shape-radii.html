<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.r{display:flex;gap:14px}.i{display:flex;flex-direction:column;gap:6px;align-items:center}.b{width:96px;height:56px;background:var(--white);border:1px solid var(--border-strong)}.k{font:var(--text-label);color:var(--text-tertiary)}</style></head><body>
<div class="r">
<div class="i"><span class="b" style="border-radius:var(--radius-xs)"></span><span class="k">2 · xs</span></div>
<div class="i"><span class="b" style="border-radius:var(--radius-sm)"></span><span class="k">4 · controls</span></div>
<div class="i"><span class="b" style="border-radius:var(--radius-md)"></span><span class="k">6 · menus</span></div>
<div class="i"><span class="b" style="border-radius:var(--radius-lg)"></span><span class="k">8 · cards</span></div>
<div class="i"><span class="b" style="border-radius:var(--radius-pill);width:56px"></span><span class="k">pill · switch</span></div>
</div></body></html>
