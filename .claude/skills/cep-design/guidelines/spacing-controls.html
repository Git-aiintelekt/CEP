<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.r{display:flex;align-items:flex-end;gap:14px}.i{display:flex;flex-direction:column;gap:6px;align-items:center}.b{background:var(--primary-50);border:1px solid var(--primary-200);border-radius:var(--radius-sm);width:96px}.k{font:var(--text-label);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body>
<div class="r">
<div class="i"><span class="b" style="height:32px"></span><span class="k">sm 32</span></div>
<div class="i"><span class="b" style="height:40px"></span><span class="k">md 40</span></div>
<div class="i"><span class="b" style="height:48px"></span><span class="k">lg 48</span></div>
<div class="i"><span class="b" style="height:40px;background:var(--bg-surface-subtle);border-color:var(--border-subtle)"></span><span class="k">row compact 40</span></div>
<div class="i"><span class="b" style="height:48px;background:var(--bg-surface-subtle);border-color:var(--border-subtle)"></span><span class="k">row 48</span></div>
</div></body></html>
