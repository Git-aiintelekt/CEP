<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);padding:16px;font:var(--text-body-role);color:var(--text-primary)}.page{background:var(--surface-page);padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-5)}.card{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:var(--sp-4)}.t{font:var(--fw-semibold) 16px/1.3 var(--font-display);margin-bottom:var(--sp-3)}.p{font:var(--text-body-role);color:var(--text-secondary)}.tag{font:var(--text-label);color:var(--text-tertiary)}</style></head><body>
<div class="page">
<div class="card"><div class="t">Section one</div><div class="p">16px padding inside the card, 12px under its title.</div></div>
<div class="card"><div class="t">Section two</div><div class="p">24px between sibling cards, 32px around the page.</div></div>
</div></body></html>
