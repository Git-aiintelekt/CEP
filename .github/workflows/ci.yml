# CI: on every pull request to main (and every push to main), the backend tests against a database built from the SQL files,
# and the frontend's typecheck, lint and tests. Nothing here touches a real database or server: the database is a throwaway
# PostgreSQL 18 container that lives for the job, and every password below exists only inside it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-owner
      PGDATABASE: cep_ci
      CEP_APP_PASSWORD: ci-app
      CEP_PLATFORM_PASSWORD: ci-platform
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install the backend and its test tools
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Build the database from the SQL files
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE cep_ci TEMPLATE template0 ENCODING 'UTF8' LOCALE_PROVIDER icu ICU_LOCALE 'en-US' LOCALE 'C'"
          bash database/build_test_db.sh

      - name: Add Django's tables and the people the tests act as
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:ci-owner@localhost:5432/cep_ci
          PLATFORM_DATABASE_URL: postgres://postgres:ci-owner@localhost:5432/cep_ci
        run: |
          bash ../database/prepare_django_tables.sh
          psql -X -q -v ON_ERROR_STOP=1 -f tests/ci_fixtures.sql

      - name: Django check
        working-directory: backend
        env:
          DATABASE_URL: postgres://cep_backend:ci-app@localhost:5432/cep_ci
          PLATFORM_DATABASE_URL: postgres://cep_platform:ci-platform@localhost:5432/cep_ci
        run: python manage.py check

      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://cep_backend:ci-app@localhost:5432/cep_ci
          PLATFORM_DATABASE_URL: postgres://cep_platform:ci-platform@localhost:5432/cep_ci
          OWNER_DATABASE_URL: postgres://postgres:ci-owner@localhost:5432/cep_ci
        run: python -m pytest -q

  production-db:
    name: Production database from nothing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-owner
      PGDATABASE: cep_prod
      CEP_APP_PASSWORD: ci-app-password-0001
      CEP_PLATFORM_PASSWORD: ci-platform-password-01
      SECRET_KEY: ci-only-not-a-secret
      DJANGO_SETTINGS_MODULE: config.settings.development
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install the backend
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Build the production database (no sample data)
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE cep_prod TEMPLATE template0 ENCODING 'UTF8' LOCALE_PROVIDER icu ICU_LOCALE 'en-US' LOCALE 'C'"
          bash database/production/build_production_db.sh

      - name: Reference data and the first platform administrator
        env:
          DATABASE_URL: postgres://cep_backend:ci-app-password-0001@localhost:5432/cep_prod
          PLATFORM_DATABASE_URL: postgres://cep_platform:ci-platform-password-01@localhost:5432/cep_prod
          CEP_PUBLIC_URL: https://c360.example.com
          CEP_ADMIN_NO_PASSWORD: "1"
        run: |
          bash database/production/load_reference_data.sh platform@c360.example "Platform Admin"
          bash database/production/load_reference_data.sh platform@c360.example "Platform Admin"

      - name: Check it
        run: psql -X -v ON_ERROR_STOP=1 -f database/production/verify.sql

  frontend:
    name: Frontend (${{ matrix.part }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and lint
        if: matrix.part == 1
        run: |
          npm run typecheck
          npm run lint

      # The suite is split three ways to finish in a few minutes. A test that times out under load gets two more tries;
      # one that fails three times fails the run.
      - name: Tests
        run: npx vitest run --shard=${{ matrix.part }}/3 --retry=2
