# Local development dependencies: PostgreSQL 18 (pool database) and Redis.
#   docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
      POSTGRES_DB: cep_pool
    ports: ["5433:5432"]
    volumes: ["cep_pg:/var/lib/postgresql"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  cep_pg:
