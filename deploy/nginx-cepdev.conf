# nginx site for the dev server (10.0.0.51, cepdev.aiintelekt.com) in production mode: /etc/nginx/sites-available/cepdev,
# with deploy/nginx-security-headers.conf as /etc/nginx/snippets/cep-security-headers.conf. Check and load:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx serves the built SPA, /static (collectstatic's output) and /media (uploaded images, which emails link to) itself; the
# API, the back-office and the health check go to gunicorn (deploy/cep-backend.service), the Insights routes to cep-insights.
# Django runs config.settings.production, which redirects plain HTTP to HTTPS and trusts X-Forwarded-Proto: the tunnel leg
# (8443) arrives over plain HTTP from Cloudflare, which ended TLS, so it says https itself; without that every request loops.

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name cepdev.aiintelekt.com;

    return 301 https://cepdev.aiintelekt.com$request_uri;
}

# HTTPS Server Block (direct access)
server {
    listen 443 ssl;
    server_name cepdev.aiintelekt.com;

    ssl_certificate /etc/nginx/ssl/2025/aiintelekt.com_fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/2025/aiintelekt.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;
    root /app/cep/frontend/dist;

    # Insights report engine (cep-insights, its own process): the Insights routes alone, before the general API block
    location ~ ^/api/v1/insights(/|$) {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django: API, admin back-office, health check
    location ~ ^/(api|admin|healthz)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The back-office's static files (collectstatic) and uploaded media, straight from disk
    location ^~ /static/ {
        alias /app/cep/backend/staticfiles/;
        include snippets/cep-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    location ^~ /media/ {
        alias /app/cep/backend/media/;
        include snippets/cep-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Built, hashed assets: cache aggressively (filenames change on every build)
    location /assets/ {
        include snippets/cep-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA (production build): serve the file if it exists, else fall back to index.html for client-side routing
    location / {
        try_files $uri /index.html;
        include snippets/cep-security-headers.conf;
        add_header Cache-Control "no-store";
    }
}

# Plain-HTTP Server Block for the Cloudflare Tunnel origin (Cloudflare's edge already
# terminates TLS for the public connection; this leg stays on the private network).
server {
    listen 8443;
    server_name cepdev.aiintelekt.com;

    client_max_body_size 50m;
    root /app/cep/frontend/dist;

    # Insights report engine (cep-insights, its own process): the Insights routes alone, before the general API block
    location ~ ^/api/v1/insights(/|$) {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(api|admin|healthz)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /static/ {
        alias /app/cep/backend/staticfiles/;
        include snippets/cep-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    location ^~ /media/ {
        alias /app/cep/backend/media/;
        include snippets/cep-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        include snippets/cep-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        include snippets/cep-security-headers.conf;
        add_header Cache-Control "no-store";
    }
}
