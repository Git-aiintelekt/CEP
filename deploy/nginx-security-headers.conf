# Security headers for the responses nginx serves itself (the SPA, its assets, /static, /media). Django sets its own on the
# API and the back-office (HSTS, nosniff, Referrer-Policy, X-Frame-Options), so this is included only in the locations
# nginx answers from disk; a location with its own add_header drops inherited ones, hence the include inside each.
# No X-Frame-Options here: the SPA's /embed/<code>/<secret> page (Insights embeds) is meant to be framed by other sites.
# Install as /etc/nginx/snippets/cep-security-headers.conf.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
